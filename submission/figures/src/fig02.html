<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}#frame{display:inline-block;line-height:0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="frame"></div><script type="module">
import { THREE, C, setup, shadowFloor, rbox, label, tube, pin, car, done, GEO, COAST } from './lib3d.js';
const { scene, render } = setup({ w: 1600, h: 700, cam: [0, 6.1, 5.4], target: [0, 0.05, 0.05], fov: 37 });
shadowFloor(scene, -0.08, 40, 0.10);
const K = 4, LAT0 = 37.85, LON0 = 128.866;
const P = ([lat, lon]) => [((lon - LON0) * 88) / K, (-(lat - LAT0) * 111) / K];
const [W, N] = P([37.912, 128.78]), [E, S] = P([37.79, 128.952]);

function board(dx, order, color, title, sub, accent) {
  const g = new THREE.Group();
  const tile = rbox(E - W, 0.12, S - N, 0.14, C.sea);
  tile.position.set((W + E) / 2, -0.06, (N + S) / 2);
  g.add(tile);
  const shape = new THREE.Shape();
  shape.moveTo(W, N);
  for (const [x, z] of COAST.map(P).filter(([, z]) => z > N - 0.8 && z < S + 0.8)) shape.lineTo(Math.min(x, E), Math.max(N, Math.min(S, z)));
  shape.lineTo(W, S);
  shape.lineTo(W, N);
  const land = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: '#F1F1EE', roughness: 0.95 }));
  land.rotation.x = Math.PI / 2;
  land.position.y = 0.04;
  land.receiveShadow = true;
  g.add(land);
  const Y = 0.09;
  const at = (k) => { const [x, z] = P(GEO[k]); return [x, Y, z]; };
  const start = [W + 0.03, Y, P([37.872, 128.78])[1]];
  const pts = [start, ...order.map(at), at('skybay')];
  // Each leg is a low arc, so legs that run back over the same stretch stay apart and the order reads at a glance.
  for (let i = 0; i + 1 < pts.length; i++) {
    const A = new THREE.Vector3(...pts[i]), B = new THREE.Vector3(...pts[i + 1]);
    const M = A.clone().add(B).multiplyScalar(0.5);
    M.y += 0.18 + 0.32 * Math.min(1, A.distanceTo(B) / 2.2);
    const curve = new THREE.QuadraticBezierCurve3(A, M, B);
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.036, 12), new THREE.MeshStandardMaterial({ color, roughness: 0.45 }));
    m.castShadow = true;
    g.add(m);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 18), new THREE.MeshStandardMaterial({ color, roughness: 0.45 }));
    const pm = curve.getPoint(0.55), pq = curve.getPoint(0.5);
    tip.position.copy(pm);
    tip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pm.clone().sub(pq).normalize());
    g.add(tip);
  }
  order.forEach((k, i) => {
    const p = at(k);
    const m = pin(color, { h: 0.18, r: 0.07 });
    m.position.set(p[0], Y - 0.02, p[2]);
    g.add(m);
    const n = label(String(i + 1), { h: 0.32, size: 60, weight: 700, color: '#fff', bg: color, border: null, pad: 0.42, radius: 1 });
    n.position.set(p[0], 0.5, p[2]);
    g.add(n);
  });
  const hotel = rbox(0.34, 0.26, 0.34, 0.05, '#FFFFFF');
  const hp = at('skybay');
  hotel.position.set(hp[0] + 0.05, 0.2, hp[2] + 0.02);
  g.add(hotel);
  const v = car('#FFFFFF', { s: 0.42 });
  v.position.set(start[0] + 0.35, 0.03, start[2] + 0.02);
  v.rotation.y = 0.05;
  g.add(v);
  const t = label(title, { sub, h: 0.8, size: 60, accent });
  t.position.set((W + E) / 2, 0.9, N - 0.2);
  g.add(t);
  g.position.x = dx;
  scene.add(g);
}
board(-2.45, ['youngjin', 'bohemian', 'cheolttuk'], '#8A93A0', '받은 순서', '운전 3시간 3분 · 227km', '#8A93A0');
board(2.45, ['cheolttuk', 'youngjin', 'bohemian'], C.blue, '현대차 내비가 찾은 순서', '운전 2시간 41분 · 218km · 22분 단축', C.blue);
const names = [['철뚝소머리집', 'cheolttuk'], ['강릉영진횟집', 'youngjin'], ['보헤미안박이추커피', 'bohemian'], ['스카이베이호텔 경포', 'skybay']];
for (const [n, k] of names) {
  const [x, z] = P(GEO[k]);
  for (const dx of [-2.45, 2.45]) { const s = label(n, { h: 0.25, size: 48, weight: 600, color: C.ink, bg: 'rgba(255,255,255,0.9)', border: null }); s.position.set(dx + x - 0.55, 0.16, z + 0.12); scene.add(s); }
}
done(render);
</script></body></html>
