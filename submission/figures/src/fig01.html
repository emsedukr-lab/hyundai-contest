<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}#frame{display:inline-block;line-height:0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="frame"></div><script type="module">
import { THREE, C, DAY, setup, shadowFloor, rbox, label, device, tube, pin, car, arc, done, GEO, COAST, proj } from './lib3d.js';
const { scene, render } = setup({ w: 1600, h: 860, cam: [0, 5.4, 9.4], target: [0, 0.95, 0.3], fov: 35 });
shadowFloor(scene, -0.08, 40, 0.10);
const K = 7;
const P = (ll) => proj(ll, K);
// Map tile cropped to the trip: lon 128.76–129.10, lat 37.63–37.92.
const [W, N] = P([37.92, 128.76]), [E, S] = P([37.63, 129.10]);
const tile = rbox(E - W, 0.12, S - N, 0.14, C.sea);
tile.position.set((W + E) / 2, -0.06, (N + S) / 2);
scene.add(tile);
const shape = new THREE.Shape();
shape.moveTo(W, N);
const coast = COAST.map((p) => P(p)).filter(([, z]) => z > N - 0.4 && z < S + 0.4);
for (const [x, z] of coast) shape.lineTo(Math.min(x, E), Math.max(N, Math.min(S, z)));
shape.lineTo(W, S);
shape.lineTo(W, N);
const land = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: '#F1F1EE', roughness: 0.95 }));
land.rotation.x = Math.PI / 2;
land.position.y = 0.04;
land.receiveShadow = true;
scene.add(land);

const Y = 0.09;
const at = (k) => { const [x, z] = P(GEO[k]); return [x, Y, z]; };
const edge = (lat) => [W + 0.03, Y, P([lat, 128.76])[1]];
const days = [
  [edge(37.865), at('cheolttuk'), at('youngjin'), at('bohemian'), at('skybay')],
  [at('skybay'), at('lake'), at('donghwa'), at('mandong'), at('umji'), at('shilla')],
  [at('shilla'), at('gyodong'), at('terarosa'), at('topsten')],
  [at('topsten'), at('badabuchae'), edge(37.69)],
];
days.forEach((pts, i) => {
  scene.add(tube(pts, 0.026, DAY[i], { tension: 0.25 }));
  pts.slice(i === 0 ? 1 : 0, i === 3 ? -1 : undefined).forEach((p) => { const m = pin(DAY[i], { h: 0.2, r: 0.055 }); m.position.set(p[0], Y - 0.02, p[2]); scene.add(m); });
});
const vehicle = car('#FFFFFF', { s: 0.36 });
const [cx, cz] = P([37.861, 128.856]);
vehicle.position.set(cx, Y - 0.05, cz);
vehicle.rotation.y = 0.8;
scene.add(vehicle);
const tag = (t, pos) => { const s = label(t, { h: 0.27, size: 52, weight: 600, color: C.muted }); s.position.set(...pos); scene.add(s); };
tag('출발', [edge(37.865)[0] + 0.1, 0.42, edge(37.865)[2] - 0.18]);
tag('귀가', [edge(37.69)[0] + 0.1, 0.42, edge(37.69)[2] - 0.18]);

// Phone (left) and the car's display (right); the one-time transfer arcs between them.
const phone = await device('../../img/phone-recommend.png', 0.86, 1.86, { bezel: 0.05, radius: 0.12, depth: 0.09 });
phone.position.set(-4.05, 1.55, 0.2);
phone.rotation.y = 0.45;
phone.traverse((o) => (o.castShadow = false));
scene.add(phone);
const disp = await device('../../img/car-measured.png', 2.15, 1.52, { bezel: 0.07, radius: 0.08, depth: 0.1 });
disp.position.set(3.85, 1.55, 0.1);
disp.rotation.y = -0.45;
disp.traverse((o) => (o.castShadow = false));
scene.add(disp);
const stand = rbox(0.42, 0.95, 0.16, 0.06, '#2A2E34');
stand.position.set(3.85, 0.4, -0.02);
stand.rotation.y = -0.45;
stand.castShadow = false;
scene.add(stand);
scene.add(arc([-3.55, 2.35, 0.2], [2.75, 2.45, 0.1], 0.75, C.graphite, { width: 0.017 }));

const L = (text, sub, pos) => { const s = label(text, { sub, h: 0.62, size: 56 }); s.position.set(...pos); scene.add(s); };
L('휴대폰에서 동선 자동 구성', '장소만 담으면 날짜·순서·시간', [-3.95, 0.15, 0.6]);
L('QR 한 번 · 종단간 암호화', '계정 없이 한 번만 옮김', [-0.4, 3.2, 0.1]);
L('현대차 내비가 재고 안내', '실제 시간·거리로 다시 측정', [3.8, -0.3, 0.55]);
['1일차', '2일차', '3일차', '4일차'].forEach((t, i) => { const s = label(t, { h: 0.28, size: 52, accent: DAY[i] }); s.position.set(-1.5 + i * 1.0, -0.05, S + 0.55); scene.add(s); });
done(render);
</script></body></html>
