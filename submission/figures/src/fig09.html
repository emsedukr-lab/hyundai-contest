<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}#frame{display:inline-block;line-height:0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="frame"></div><script type="module">
import { THREE, C, setup, shadowFloor, rbox, label, device, arc, mat, done } from './lib3d.js';
const { scene, render } = setup({ w: 1600, h: 860, cam: [0, 10.5, 13.5], target: [0, 0.4, -1.0], fov: 27 });
shadowFloor(scene, 0, 60, 0.10);
const plate = (x, z, w, d, color = '#FFFFFF') => { const p = rbox(w, 0.18, d, 0.12, color); p.position.set(x, 0.09, z); scene.add(p); return p; };
const block = (x, z, w, h, d, color, y = 0.18) => { const b = rbox(w, h, d, 0.07, color); b.position.set(x, y + h / 2, z); scene.add(b); return b; };
const L = (t, sub, pos, o = {}) => { const k = 1.3; const s = label(t, { sub, size: 56, ...o, h: (o.h ?? (sub ? 0.56 : 0.3)) * k }); s.position.set(...pos); scene.add(s); return s; };

// Phone (left)
plate(-5.0, 0, 3.0, 2.6);
const phone = await device('../../img/phone-recommend.png', 0.62, 1.34, { bezel: 0.04, radius: 0.09, depth: 0.07 });
phone.position.set(-5.6, 0.95, -0.2);
phone.rotation.x = -0.12;
scene.add(phone);
block(-4.35, -0.45, 1.1, 0.34, 0.8, C.blue);
block(-4.35, 0.6, 1.1, 0.22, 0.8, '#C9D7F2');
L('여행 전체 최적화 엔진', 'TypeScript · 의존성 없음', [-4.0, 1.5, -0.45], { h: 0.46, size: 50 });
L('여행은 휴대폰 안에만', null, [-4.35, 0.55, 0.95], { h: 0.24, size: 50, weight: 500 });
L('휴대폰 · 모바일 웹', '설치 없이 QR로 열림 · React', [-5.0, 0.1, 2.0]);

// Relay (centre)
plate(0, 0, 2.6, 2.6);
block(-0.35, -0.1, 0.9, 1.1, 0.9, C.graphite);
block(0.75, 0.35, 0.7, 0.5, 0.7, '#6B7480');
L('세션 1개 · 5분 · 1회', 'Durable Object', [-0.35, 1.75, -0.1], { h: 0.46, size: 50 });
L('중계 서버', 'Cloudflare Workers · 내용을 볼 수 없음', [0, 0.1, 2.0]);
// Kakao, reached only through the relay
plate(0, -4.3, 2.4, 1.3, '#FFF7DA');
block(0, -4.3, 1.2, 0.3, 0.6, '#F2C94C');
L('카카오 장소 검색 · 길찾기', '좌표만 전달 · 저장 안 함', [0, 0.95, -4.3], { h: 0.46, size: 50 });
scene.add(arc([0.2, 0.7, -0.7], [0.1, 0.6, -3.6], 0.5, '#9AA3AF', { width: 0.02 }));

// Car (right)
plate(5.0, 0, 3.2, 2.6);
const disp = await device('../../img/car-measured.png', 1.5, 1.06, { bezel: 0.05, radius: 0.06, depth: 0.08 });
disp.position.set(4.35, 1.05, -0.55);
disp.rotation.x = -0.1;
scene.add(disp);
const mods = [['NaviHelper 3.0.5', C.blue, -0.45], ['Vehicle SDK 2.3.2 · 조회', C.teal, 0.25], ['CarUxRestrictions', '#8A93A0', 0.95]];
mods.forEach(([t, c, z]) => { block(5.95, z, 1.0, 0.18, 0.5, c); });
L('NaviHelper 3.0.5', null, [5.95, 0.42, -0.25], { h: 0.22, size: 50 });
L('Vehicle SDK · 조회 전용', null, [5.95, 0.42, 0.45], { h: 0.22, size: 50 });
L('CarUxRestrictions', null, [5.95, 0.42, 1.15], { h: 0.22, size: 50 });
L('차량 앱 · Pleos Connect', 'Kotlin · Jetpack Compose', [5.0, 0.1, 2.0]);
// The Hyundai navigation, driven only through NaviHelper
plate(5.6, -4.3, 2.4, 1.3, '#E7EEFB');
block(5.6, -4.3, 1.2, 0.3, 0.6, C.blue);
L('현대차 내비', '안내 · 측정 · 남은 시간 · 도착', [5.6, 0.95, -4.3], { h: 0.46, size: 50 });
scene.add(arc([6.0, 0.45, -0.75], [5.75, 0.6, -3.6], 0.55, C.blue, { width: 0.02 }));

// The trip: phone → relay → car, sealed end to end.
scene.add(arc([-3.6, 0.55, -0.2], [-1.4, 0.55, -0.2], 0.7, C.graphite, { width: 0.022 }));
scene.add(arc([1.4, 0.55, -0.2], [3.3, 0.55, -0.2], 0.7, C.graphite, { width: 0.022 }));
L('암호화한 여행 1개', 'P-256 ECDH · AES-256-GCM', [-2.4, 2.55, -0.2], { h: 0.46, size: 50 });
L('6자리 확인 코드 · 차에서 승인', null, [2.35, 2.2, -0.2], { h: 0.24, size: 50 });
done(render);
</script></body></html>
