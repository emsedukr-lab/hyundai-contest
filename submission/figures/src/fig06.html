<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}#frame{display:inline-block;line-height:0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="frame"></div><script type="module">
import { THREE, C, setup, shadowFloor, rbox, label, car, mat, done } from './lib3d.js';
const { scene, render } = setup({ w: 1600, h: 720, cam: [0.15, 3.3, 11.8], target: [0.15, 1.25, 0], fov: 26 });
shadowFloor(scene, 0, 40, 0.10);
// The road: the car on the left, then the waypoints in order; the first stretch (203 km) is drawn short, with a break.
const road = rbox(10.6, 0.04, 0.7, 0.02, '#3A3F47', { roughness: 0.8 });
road.position.set(0.3, 0.02, 0);
scene.add(road);
for (let x = -4.6; x < 5.4; x += 0.5) {
  if (x > -2.9 && x < -2.1) continue;
  const d = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.005, 0.04), mat('#FFFFFF'));
  d.position.set(x, 0.045, 0);
  scene.add(d);
}
for (const dx of [-2.62, -2.38]) { // the break in the first stretch
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.9), mat('#FFFFFF'));
  b.position.set(dx, 0.05, 0);
  b.rotation.y = 0.35;
  scene.add(b);
}
const v = car('#FFFFFF', { s: 0.8 });
v.position.set(-4.5, 0.05, 0.05);
scene.add(v);

// Remaining time to each point, as the navigation reports it on one route (minutes, km).
const pts = [
  { x: -1.6, name: '철뚝소머리집', m: 133, km: 203 },
  { x: 0.4, name: '강릉영진횟집', m: 139, km: 206 },
  { x: 2.4, name: '보헤미안박이추커피', m: 149, km: 211 },
  { x: 4.4, name: '스카이베이호텔 경포', m: 161, km: 218 },
];
const H = (m) => 0.3 + (m - 120) * 0.06; // the axis starts at 120 minutes, so the steps stay visible
const hm = (m) => `${Math.floor(m / 60)}시간 ${m % 60}분`;
pts.forEach((p, i) => {
  const h = H(p.m);
  const prev = i ? H(pts[i - 1].m) : h;
  const base = rbox(0.62, prev, 0.62, 0.05, '#E4E7EC');
  base.position.set(p.x, prev / 2 + 0.04, -0.9);
  scene.add(base);
  if (i) {
    const top = rbox(0.62, h - prev, 0.62, 0.05, C.blue);
    top.position.set(p.x, prev + (h - prev) / 2 + 0.04, -0.9);
    scene.add(top);
  }
  const t = label(`남은 ${hm(p.m)}`, { sub: `${p.km}km`, h: 0.56, size: 54 });
  t.position.set(p.x, h + 0.5, -0.9);
  scene.add(t);
  const flag = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.06, 24), mat(i === 3 ? C.graphite : C.blue));
  flag.position.set(p.x, 0.07, 0);
  scene.add(flag);
  const n = label(i === 3 ? `${p.name} (목적지)` : `경유지 ${i + 1} · ${p.name}`, { h: 0.27, size: 50, weight: 600, color: C.ink });
  n.position.set(p.x, -0.12, 0.85);
  scene.add(n);
  if (i) {
    const d = label(`+${p.m - pts[i - 1].m}분 · ${p.km - pts[i - 1].km}km`, { h: 0.34, size: 58, weight: 700, color: '#FFFFFF', bg: C.blue, border: null });
    d.position.set((p.x + pts[i - 1].x) / 2, 0.42, 0.25);
    scene.add(d);
  }
});
const first = label('2시간 13분 · 203km', { h: 0.32, size: 56, weight: 700, color: C.ink });
first.position.set(-3.0, 0.42, 0.25);
scene.add(first);
const carTag = label('차의 현재 위치', { h: 0.27, size: 50, weight: 600, color: C.muted });
carTag.position.set(-4.5, -0.12, 0.85);
scene.add(carTag);
done(render);
</script></body></html>
